# Message texts (FR.1.2). Arguments are substituted with java.text.MessageFormat.
regulatory-event.subject=Regulatory event detected
regulatory-event.body=Site {0}, located at {1} received a {2} {3} on {4}. [{5}%]
certificate-expiry.subject=Certificate expiring soon
certificate-expiry.body=The {0} certificate for {1}, located at {2}, issued by {3} expires on {4}.

# java.time.format.DateTimeFormatter pattern, applied with the message locale.
date.format=d MMMM yyyy

# Document-type labels. Unknown codes fall back to the humanised code (NEW_TYPE -> "new type").
document-type.WARNING_LETTER=warning letter
document-type.OAI=official action indicated
document-type.NON_COMPLIANCE_REPORT=non compliance report
