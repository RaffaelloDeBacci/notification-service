DistributionListChannel:
  type: string
  enum:
    - EMAIL
    - SLACK

DistributionListTargetRequest:
  type: object
  required:
    - deliveryChannel
    - notificationTarget
  properties:
    deliveryChannel:
      $ref: '#/DistributionListChannel'
    notificationTarget:
      type: string
      minLength: 1
      maxLength: 320
      description: >-
        Channel-specific destination. For EMAIL a syntactically valid e-mail
        address; for SLACK a non-blank channel identifier.
      example: ops@example.com

UpsertDistributionListRequest:
  type: object
  required:
    - targets
  properties:
    targets:
      type: array
      minItems: 1
      maxItems: 50
      items:
        $ref: '#/DistributionListTargetRequest'

DistributionListTargetResponse:
  type: object
  required:
    - deliveryChannel
    - notificationTarget
  properties:
    deliveryChannel:
      $ref: '#/DistributionListChannel'
    notificationTarget:
      type: string

DistributionListResponse:
  type: object
  required:
    - customerReference
    - targets
  properties:
    customerReference:
      type: string
    targets:
      type: array
      items:
        $ref: '#/DistributionListTargetResponse'
