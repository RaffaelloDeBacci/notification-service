    MessageType:
      $ref: './components/schemas/notifications.yaml#/MessageType'
    IngestNotificationRequest:
      $ref: './components/schemas/notifications.yaml#/IngestNotificationRequest'
    RegulatoryEventIngestRequest:
      $ref: './components/schemas/notifications.yaml#/RegulatoryEventIngestRequest'
    CertificateExpiryIngestRequest:
      $ref: './components/schemas/notifications.yaml#/CertificateExpiryIngestRequest'
    ProcessNotificationResponse:
